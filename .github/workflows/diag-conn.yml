name: diag-conn
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install telethon
      - name: Run diag
        env:
          BOT_SESSION: ${{ secrets.BOT_SESSION }}
          API_ID: 2040
          API_HASH: b18441a1ff607e10a989891a5462e627
        run: python diag_conn.py
