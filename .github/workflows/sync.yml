name: tg-sync
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: tg-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install telethon pillow

      - name: Run forwarder
        env:
          BOT_SESSION: ${{ secrets.BOT_SESSION }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SOURCE: ${{ vars.SOURCE }}
          DEST: ${{ vars.DEST }}
          WM_MODE: ${{ vars.WM_MODE }}
          WM_AMOUNT: ${{ vars.WM_AMOUNT || '0.10' }}
          WM_POS: ${{ vars.WM_POS }}
          AD_FILTER: ${{ vars.AD_FILTER }}
          AD_LLM: ${{ vars.AD_LLM }}
          REWRITE: ${{ vars.REWRITE }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "sync state [skip ci]"
          git pull --rebase origin main || true
          git push origin main || true
