name: tg-sync
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: tg-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 运行搬运机器人
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOURCE: ${{ vars.SOURCE }}
          DEST: ${{ vars.DEST }}
          MODE: ${{ vars.MODE }}
          WM_MODE: ${{ vars.WM_MODE }}
          WM_AMOUNT: ${{ vars.WM_AMOUNT }}
          AD_FILTER: ${{ vars.AD_FILTER }}
          AD_KEYWORDS: ${{ vars.AD_KEYWORDS }}
          AD_LLM: ${{ vars.AD_LLM }}
          REWRITE: ${{ vars.REWRITE }}
          REWRITE_PROMPT: ${{ vars.REWRITE_PROMPT }}
          EDIT_SYNC: ${{ vars.EDIT_SYNC }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          STATE_FILE: state.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py