name: DiagVideo
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run diag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python diag_video.py